{% set name = "bely-cli" %}
{% set version = "2026.10.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ..

build:
  number: 0
  noarch: python
  entry_points:
    - bely-cli = bely_cli.cli:main

requirements:
  host:
    - pip
    - python >3.10
    - setuptools
  run:
    - python >3.10
    - click
    - pyyaml
    - bely-api==2026.10.0
    - textual >=8.2.8
    - rich
    - textual-image >=0.12.0

test:
  imports:
    - bely_cli
  source_files:
    - test
  requires:
    - python
    - pytest
    - pytest-xdist
  commands:
    - python -m pytest -n auto test
    - bely-cli -h

about:
  home: "https://github.com/AdvancedPhotonSource/BELY"
  license: "Copyright (c) UChicago Argonne, LLC. All rights reserved."
  summary: "Command-line interface for the BELY"
