{% set name = "bely-mqtt-framework" %}
{% set version = "0.1.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ./src

requirements:
  build:
    - pip
    - python>3.10
  run:
    - python
    - click
    - paho-mqtt
    - pydantic
    - python-dotenv
    - pluggy
    - pyyaml
    - apprise
    - bely-api

test:
  imports:
    - bely_mqtt
  source_files:
    - tests
    - pytest.ini
  requires:
    - pytest
    - pytest-asyncio
  commands:
    - pytest tests -v

about:
  home: "https://git.aps.anl.gov/controls/hla/bely"
  license: "Copyright (c) UChicago Argonne, LLC. All rights reserved."
  summary: "Pluggable Python framework for handling BELY MQTT events"
