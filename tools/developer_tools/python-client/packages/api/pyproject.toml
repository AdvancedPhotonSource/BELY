[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bely-api"
version = "2026.3.0"
description = "Python client API library used to communicate with BELY API."
license = { text = "Copyright (c) UChicago Argonne, LLC. All rights reserved." }
maintainers = [
    { name = "Dariusz Jarosz", email = "djarosz@aps.anl.gov" },
]
requires-python = ">=3.10"
dependencies = [
    "python-dateutil",
    "urllib3",
    "certifi",
    "pydantic>=1.10",
]

[project.urls]
Homepage = "https://github.com/AdvancedPhotonSource/BELY"

[project.scripts]
bely-test = "BelyApiFactory:run_command"

# belyApi/ is generated by ../../generatePyClient.sh and is gitignored, so it must be
# explicitly included here -- hatchling otherwise honors .gitignore when selecting files.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["belyApi", "BelyApiFactory.py"]

[tool.hatch.build.targets.sdist]
only-include = ["belyApi", "BelyApiFactory.py"]
